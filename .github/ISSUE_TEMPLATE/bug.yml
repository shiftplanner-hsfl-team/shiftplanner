name: Bug
description: Gefundener Defekt (Pflicht als Ticket ab P5)
title: "BUG: "
labels: ["bug"]
body:
  - type: textarea
    id: schritte
    attributes: {label: Schritte zur Reproduktion}
    validations: {required: true}
  - type: textarea
    id: erwartet
    attributes: {label: Erwartetes Ergebnis}
  - type: textarea
    id: tatsaechlich
    attributes: {label: Tatsächliches Ergebnis}
  - type: input
    id: testfall
    attributes: {label: Zugehöriger Testfall / Anforderung, placeholder: "TC-xx / REQ-xx"}
