services:
  - type: web
    name: shiftplanner-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: 'test -n "$DATABASE_URL" && python manage.py migrate --noinput && python manage.py seed_demo && gunicorn shiftplanner.wsgi:application'
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "0"
      - key: SHIFTPLANNER_PUBLIC_DEMO
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
