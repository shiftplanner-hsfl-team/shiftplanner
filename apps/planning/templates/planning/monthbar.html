<form method="get" class="monthbar"><label>Planungsmonat <input type="month" name="month" value="{{ month_value }}" min="2020-01" max="2100-12"></label>{% if weeks %}<label>Woche <select name="week">{% for w in weeks %}<option value="{{ w }}" {% if week == w %}selected{% endif %}>KW {{ w }}</option>{% endfor %}</select></label>{% endif %}<button class="secondary">Anzeigen</button></form>
